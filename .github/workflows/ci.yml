name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: sudo apt-get install -y ripgrep
      # Konfiguration als ~/.config/nvim einhaengen, Plugins per lazy.nvim
      # synchronisieren und einen Headless-Start fehlerfrei durchlaufen.
      - run: |
          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE" ~/.config/nvim
          nvim --headless "+Lazy! sync" +qa
          nvim --headless +qa
